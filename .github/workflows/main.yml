name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Project & Build APK
        run: |
          echo "=== 1. Checking repository files ==="
          # জিপ ফাইল থাকলে আনজিপ করা
          for f in $(find . -maxdepth 3 -name "*.zip" -o -name "*mypay*"); do
            if [ -f "$f" ]; then
              echo "Extracting: $f"
              unzip -q -o "$f" || true
            fi
          done

          # প্রজেক্ট ডিরেক্টরি খুঁজে বের করা
          BUILD_FILE=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # অফিসিয়াল Gradle Wrapper ডাউনলোড করা (মিসিং ফাইলের সমাধান)
          mkdir -p gradle/wrapper
          echo "Downloading official Gradle 8.6 Wrapper..."
          curl -sSLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar
          curl -sSLo gradlew https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradlew
          chmod +x gradlew

          echo "=== 2. Compiling Debug APK ==="
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPay-Debug-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 14
