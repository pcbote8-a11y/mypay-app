name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Find Project and Build APK
        run: |
          echo "Locating Android project..."
          for f in $(find . -name "*.zip"); do
            echo "Unzipping $f..."
            unzip -q -o "$f"
          done

          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew not found!"
            ls -la
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Project found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPay-Debug-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 14
