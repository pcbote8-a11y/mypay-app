name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract and Compile APK
        run: |
          echo "=== 1. Extracting Project Zip ==="
          find . -name "*.zip" -exec unzip -q -o {} \;

          echo "=== 2. Locating Project ==="
          BUILD_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          echo "Found project at: $BUILD_DIR"
          cd "$BUILD_DIR"

          echo "=== 3. Setup Gradle Wrapper ==="
          mkdir -p gradle/wrapper
          curl -sSLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar
          curl -sSLo gradlew https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradlew
          chmod +x gradlew

          echo "=== 4. Building Debug APK ==="
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPay-Debug-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 14
